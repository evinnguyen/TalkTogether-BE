version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: talktogether-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - talktogether-network

  # PgAdmin (Giao diện Web quản lý PostgreSQL - Tùy chọn)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: talktogether-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - talktogether-network

volumes:
  postgres_data:

networks:
  talktogether-network:
    driver: bridge
